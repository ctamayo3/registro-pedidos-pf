<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FDFAF0">
    <title>Peludos Factory - Arma tu Pedido</title>
    <link rel="icon" type="image/png" href="/logo-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FDFAF0;
            --surface: #FFFFFF;
            --surface-2: #F7F0E3;
            --ink: #2A1F1A;
            --muted: #6F6254;
            --faint: #A39683;
            --line: #E8DECB;
            --accent: #E8703A;
            --accent-dark: #BF4A22;
            --accent-soft: #FCE6D8;
            --accent-softer: #FFF4EC;
            --accent-gradient: linear-gradient(135deg, #E2672F 0%, #BF4A22 100%);
            --success: #2F7D5B;
            --success-soft: #E2F0E8;
            --danger: #B5482F;
            --danger-soft: #F7E4DE;
            --r-lg: 24px;
            --r-md: 18px;
            --r-sm: 14px;
            --shadow-1: 0 1px 2px rgba(74, 52, 32, .05), 0 6px 18px rgba(196, 82, 42, .08);
            --shadow-2: 0 2px 6px rgba(74, 52, 32, .06), 0 18px 40px rgba(74, 52, 32, .14);
            --shadow-cta: 0 8px 22px rgba(191, 74, 34, .32);
            --display: 'Fraunces', Georgia, serif;
            --ease: cubic-bezier(.2, .8, .2, 1);
            --spring: cubic-bezier(.34, 1.56, .64, 1);
            --topbar-h: 104px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: var(--ink);
            background: radial-gradient(130% 55% at 50% -12%, #FFE7D3 0%, rgba(255, 231, 211, 0) 62%), var(--bg);
            background-attachment: fixed; min-height: 100vh;
            padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px));
        }
        button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
        button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
        [hidden] { display: none !important; }

        /* ---------- Barra superior ---------- */
        .topbar { position: sticky; top: 0; z-index: 20; background: rgba(253, 250, 240, .88); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
            padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid rgba(232, 222, 203, .7); }
        .topbar-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .topbar-fila { display: flex; align-items: center; gap: 10px; min-height: 36px; }
        .atras { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1); display: grid; place-items: center; font-size: .9rem; flex: none; transition: transform .15s var(--ease); }
        .atras:active { transform: scale(.92); }
        .marca { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 600; font-size: 1.05rem; flex: 1; min-width: 0; }
        .marca img { width: 32px; height: 32px; border-radius: 10px; }
        .demo-tag { font-size: .68rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-dark); background: var(--accent-soft); padding: 4px 9px; border-radius: 99px; flex: none; }
        .pasos { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .pasos li { display: flex; flex-direction: column; gap: 6px; font-size: .72rem; font-weight: 600; color: var(--faint); transition: color .3s; }
        .pasos li::before { content: ""; height: 5px; border-radius: 99px; background: var(--line); transition: background .4s var(--ease); }
        .pasos li.hecho { color: var(--muted); }
        .pasos li.hecho::before { background: var(--accent); opacity: .45; }
        .pasos li.actual { color: var(--accent-dark); }
        .pasos li.actual::before { background: var(--accent-gradient); }

        /* ---------- Contenido ---------- */
        main { max-width: 520px; margin: 0 auto; padding: 22px 18px 0; }
        .vista { display: flex; flex-direction: column; gap: 22px; }
        .vista > * { animation: entra .5s var(--ease) both; }
        .vista > *:nth-child(2) { animation-delay: .05s; } .vista > *:nth-child(3) { animation-delay: .1s; }
        .vista > *:nth-child(4) { animation-delay: .15s; } .vista > *:nth-child(n+5) { animation-delay: .2s; }
        @keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        .hero { text-align: center; padding: 6px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .hero-logo { width: 76px; height: 76px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-2); display: grid; place-items: center; }
        .hero-logo img { width: 64px; height: 64px; border-radius: 18px; }
        h1 { font-family: var(--display); font-weight: 600; font-size: 2.05rem; line-height: 1.05; letter-spacing: -.01em; }
        .hero p { color: var(--muted); max-width: 30ch; }
        .titulo { display: flex; flex-direction: column; gap: 6px; }
        .titulo h1 { font-size: 1.75rem; }
        .titulo p { color: var(--muted); }
        .pregunta { font-family: var(--display); font-weight: 600; font-size: 1.2rem; line-height: 1.2; }
        .bloque { display: flex; flex-direction: column; gap: 12px; }

        /* Opciones tipo tarjeta */
        .op { position: relative; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); border: 2px solid transparent;
            transition: transform .18s var(--ease), border-color .18s, background .18s, box-shadow .18s; text-align: left; }
        .op:active { transform: scale(.97); }
        .op.sel { border-color: var(--accent); background: var(--accent-softer); box-shadow: 0 6px 18px rgba(232, 112, 58, .18); }
        .tick { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-gradient); color: #fff; display: grid; place-items: center;
            font-size: .7rem; transform: scale(0); transition: transform .32s var(--spring); box-shadow: 0 3px 8px rgba(191, 74, 34, .35); pointer-events: none; }
        .op.sel .tick { transform: scale(1); }

        .canales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .canal { padding: 16px 6px 13px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; font-size: .84rem; text-align: center; }
        .canal i { font-size: 1.65rem; }
        .canal .fa-whatsapp { color: #1FAF5A; } .canal .fa-instagram { color: #D6338C; } .canal .fa-tiktok { color: var(--ink); }

        .campo { display: flex; flex-direction: column; gap: 7px; }
        .campo label { font-weight: 600; font-size: .88rem; }
        .campo small { color: var(--muted); font-weight: 400; }
        .campo input, .campo textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-sm);
            padding: 15px 16px; transition: border-color .15s, box-shadow .15s; }
        .campo textarea { min-height: 96px; resize: vertical; }
        .campo input::placeholder, .campo textarea::placeholder { color: var(--faint); }
        .campo input:focus, .campo textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

        /* Elegir producto */
        .productos { display: flex; flex-direction: column; gap: 12px; }
        .producto { display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; width: 100%; }
        .producto .ilus { width: 80px; height: 80px; flex: none; }
        .producto-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .producto-info b { font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.15; }
        .producto-info span { color: var(--muted); font-size: .86rem; }
        .producto-info .producto-precio { font-weight: 700; color: var(--accent-dark); font-size: .95rem; margin-top: 3px; }
        .producto > .fa-chevron-right { color: var(--faint); font-size: .8rem; }
        .producto-info .regalo { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; margin-top: 6px; background: var(--success-soft); color: var(--success); font-weight: 600; font-size: .72rem; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }

        /* Armar producto: secciones que se abren y cierran */
        .armar-cab { display: flex; align-items: center; gap: 12px; }
        .armar-cab .ilus { width: 64px; height: 64px; flex: none; }
        .secciones { display: flex; flex-direction: column; gap: 10px; }
        .sec { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); scroll-margin-top: calc(var(--topbar-h) + 14px); transition: box-shadow .25s; }
        .sec.abierta { box-shadow: var(--shadow-2); }
        .sec.falta { animation: sacude .45s var(--ease); box-shadow: 0 0 0 2px var(--danger), var(--shadow-1); }
        @keyframes sacude { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
        .sec-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 16px; text-align: left; min-height: 58px; }
        .sec-num { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--muted); background: var(--surface-2); transition: background .3s, color .3s, transform .35s var(--spring); }
        .sec.abierta .sec-num { background: var(--accent-soft); color: var(--accent-dark); }
        .sec.lista .sec-num { background: var(--success); color: #fff; transform: scale(1.04); }
        .sec-tit { font-weight: 600; flex: 1; min-width: 0; }
        .sec.abierta .sec-tit { font-family: var(--display); font-size: 1.15rem; }
        .sec-res { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .86rem; font-weight: 500; max-width: 55%; min-width: 0; }
        .sec-res span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sec-res img, .sec-res .mini-sw { width: 20px; height: 20px; border-radius: 6px; flex: none; object-fit: cover; }
        .sec-res .mini-sw { box-shadow: inset 0 0 0 1px rgba(42, 31, 26, .14); }
        .sec-opc { font-size: .72rem; font-weight: 600; color: var(--faint); }
        .sec-head .fa-chevron-down { color: var(--faint); font-size: .75rem; transition: transform .25s var(--ease); }
        .sec.abierta .sec-head .fa-chevron-down { transform: rotate(180deg); }
        .sec-body { padding: 2px 16px 18px; display: flex; flex-direction: column; gap: 14px; animation: abre .38s var(--ease) both; }
        @keyframes abre { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
        .nota { font-size: .8rem; color: var(--muted); line-height: 1.4; }

        .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modelo { padding: 12px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
        .modelo .ilus { width: 96px; height: 96px; }
        .modelo b { font-weight: 600; }
        .modelo span { color: var(--accent-dark); font-weight: 700; font-size: .9rem; }
        .gran { padding: 18px 10px; text-align: center; font-weight: 600; font-size: 1rem; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .gran i { font-size: 1.3rem; color: var(--accent); }
        .tallas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .talla { aspect-ratio: 1; display: grid; place-items: center; font-weight: 700; font-size: 1rem; border-radius: var(--r-sm); }
        .foto-op { padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px; text-align: center; font-weight: 600; }
        .foto-op img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--surface-2); }

        .familias { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 6px; scrollbar-width: none; }
        .familias::-webkit-scrollbar { display: none; }
        .familia { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px 8px 9px; border-radius: 99px; background: var(--surface-2); font-weight: 600; font-size: .84rem; border: 2px solid transparent; transition: background .15s, border-color .15s; }
        .familia i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(42, 31, 26, .14); }
        .familia.sel { background: var(--accent-softer); border-color: var(--accent); color: var(--accent-dark); }
        .tonos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 8px; }
        .tono { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .68rem; font-weight: 600; color: var(--muted); }
        .tono i { width: 100%; aspect-ratio: 1; border-radius: 16px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(42, 31, 26, .12); display: grid; place-items: center; transition: transform .22s var(--spring), box-shadow .18s; font-style: normal; }
        .tono i::after { font: var(--fa-font-solid); content: "\f00c"; font-size: .9rem; color: var(--ct); transform: scale(0); transition: transform .3s var(--spring); }
        .tono:active i { transform: scale(.92); }
        .tono.sel i { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); transform: scale(.94); }
        .tono.sel i::after { transform: scale(1); }
        .tono.sel { color: var(--accent-dark); }

        .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 99px; padding: 4px; gap: 4px; }
        .seg button { padding: 9px 8px; border-radius: 99px; font-weight: 600; font-size: .9rem; color: var(--muted); transition: background .2s, color .2s, box-shadow .2s; }
        .seg button.sel { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
        .patrones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .patron { padding: 8px 8px 9px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; color: var(--muted); }
        .patron img, .patron .sin { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 12px; background: var(--surface-2); padding: 8px; }
        .patron .sin { display: grid; place-items: center; font-size: 1.5rem; color: var(--faint); }

        .guia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .guia figure { display: flex; flex-direction: column; gap: 6px; text-align: center; font-size: .7rem; font-weight: 600; line-height: 1.25; }
        .guia-img { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #FFE3CC; }
        .guia-img svg { width: 100%; height: 100%; display: block; }
        .guia-img b { position: absolute; right: 5px; bottom: 5px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .62rem; }
        .guia .ok b { background: var(--success); } .guia .mal b { background: var(--danger); }
        .guia .ok { color: var(--success); } .guia .mal { color: var(--danger); }
        .guia .oscura svg { filter: brightness(.42) blur(1.4px); }
        .subir { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; border-radius: var(--r-md); border: 2px dashed var(--accent); background: var(--accent-softer); color: var(--accent-dark); font-weight: 600; transition: transform .15s var(--ease), background .15s; }
        .subir:active { transform: scale(.98); background: var(--accent-soft); }
        .subir i { font-size: 1.3rem; }
        .fotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .foto { position: relative; aspect-ratio: 1; animation: entra .35s var(--ease) both; }
        .foto img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; display: block; }
        .foto button { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .7rem; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
        .foto span { position: absolute; left: 5px; bottom: 5px; background: rgba(42, 31, 26, .78); color: #fff; font-size: .62rem; font-weight: 600; padding: 2px 6px; border-radius: 99px; }

        /* Botones */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 26px; border-radius: 99px; background: var(--accent-gradient); color: #fff; font-weight: 700; font-size: 1rem;
            box-shadow: var(--shadow-cta); transition: transform .15s var(--ease), box-shadow .15s, filter .15s; text-decoration: none; }
        .btn:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(191, 74, 34, .3); }
        .btn-2 { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
        .btn-chico { min-height: 44px; padding: 0 20px; font-size: .92rem; align-self: flex-start; }
        .btn-ancho { width: 100%; }
        .enlace { color: var(--accent-dark); font-weight: 600; font-size: .9rem; padding: 6px 2px; }

        /* Barra inferior */
        .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); background: rgba(253, 250, 240, .92);
            backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid rgba(232, 222, 203, .8); transition: transform .35s var(--ease); }
        .barra.oculta { transform: translateY(110%); }
        .barra-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
        .barra-total { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .barra-total small { color: var(--muted); font-size: .76rem; font-weight: 500; }
        .barra-total b { font-family: var(--display); font-weight: 600; font-size: 1.55rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
        .barra .btn.late { animation: late 1.6s var(--ease) 2; }
        @keyframes late { 50% { transform: scale(1.045); box-shadow: 0 10px 28px rgba(191, 74, 34, .45); } }

        /* Tu pedido */
        .linea { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); padding: 14px; display: flex; gap: 12px; }
        .linea-foto { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; flex: none; background: var(--surface-2); }
        .linea-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
        .linea-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
        .linea-top span:last-child { color: var(--accent-dark); white-space: nowrap; font-weight: 700; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); padding: 3px 10px; border-radius: 99px; font-size: .76rem; font-weight: 500; }
        .chip i { width: 11px; height: 11px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(42, 31, 26, .14); }
        .chip img { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; }
        .linea-acc { display: flex; gap: 16px; }
        .linea-acc button { font-size: .84rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
        .linea-acc button:first-child { color: var(--accent-dark); }
        .otro { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: var(--r-md); border: 2px dashed var(--line); color: var(--muted); font-weight: 600; width: 100%; transition: border-color .15s, color .15s; }
        .otro:active { border-color: var(--accent); color: var(--accent-dark); }
        .datos-fila { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); padding: 13px 16px; }
        .datos-fila > i { font-size: 1.3rem; }
        .datos-fila div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .datos-fila small { color: var(--muted); }
        .aviso { background: var(--accent-soft); color: #8A3A19; padding: 14px 16px; border-radius: var(--r-md); font-size: .88rem; line-height: 1.45; }

        /* Exito */
        .exito { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px; }
        .exito-icono { width: 84px; height: 84px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; font-size: 2.1rem; animation: pop .6s var(--spring) both; box-shadow: 0 12px 28px rgba(47, 125, 91, .35); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .codigo { font-family: var(--display); font-weight: 600; font-size: 1.5rem; background: var(--surface); padding: 8px 20px; border-radius: 99px; box-shadow: var(--shadow-1); letter-spacing: .02em; }
        .pago { background: var(--accent-gradient); color: #fff; padding: 16px 18px; border-radius: var(--r-md); font-weight: 600; display: flex; align-items: center; gap: 13px; line-height: 1.35; box-shadow: var(--shadow-cta); }
        .pago i { font-size: 1.6rem; flex: none; }
        .total-fila { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-weight: 600; font-size: 1.35rem; padding: 4px 4px 0; }

                        ${lista.map(p => opcion('patron', p.nombre, 'patron', `<img src="${esc(p.imagen_url)}" alt="" loading="lazy">N.º ${esc(p.nombre)}`, d.patron === p.nombre)).join('')}

            mascota(d) {
                return `<div class="campo"><label for="in-mascota">Nombre de tu mascota</label><input type="text" id="in-mascota" data-borrador="mascota" value="${esc(d.mascota)}" autocomplete="off"></div>
                    <div class="campo"><label for="in-ano">Año de nacimiento <small>(opcional)</small></label><input type="text" id="in-ano" inputmode="numeric" data-borrador="ano" value="${esc(d.ano)}" autocomplete="off"></div>
                    <div class="campo"><label for="in-raza">Raza o frase <small>(opcional)</small></label><input type="text" id="in-raza" data-borrador="raza" value="${esc(d.raza)}" autocomplete="off"></div>
                    <button type="button" class="btn btn-chico" data-action="listo" data-sec="mascota">Listo</button>`;
            },
            fotos(d) {
                const extra = Math.max(0, d.fotos.length - 3);
                return `<div class="guia">
                        <figure class="ok"><div class="guia-img"><svg viewBox="0 0 80 80">${PERRO}</svg><b><i class="fa-solid fa-check"></i></b></div>De frente y con buena luz</figure>
                        <figure class="mal oscura"><div class="guia-img"><svg viewBox="0 0 80 80">${PERRO}</svg><b><i class="fa-solid fa-xmark"></i></b></div>Oscura o borrosa</figure>
                        <figure class="mal"><div class="guia-img"><svg viewBox="0 0 80 80"><g transform="translate(46 44) scale(.62)">${PERRO}</g></svg><b><i class="fa-solid fa-xmark"></i></b></div>Muy lejos o cortada</figure>
                    </div>
                    <button type="button" class="subir" data-action="elegirFotos"><i class="fa-solid fa-camera"></i>${d.fotos.length ? 'Agregar más fotos' : 'Elegir fotos'}</button>
                    <input type="file" id="in-fotos" accept="image/*" multiple hidden>
                    ${d.fotos.length ? `<div class="fotos">${d.fotos.map((f, i) => `<div class="foto"><img src="${urlFoto(f)}" alt="Foto ${i + 1}">${i >= 3 ? '<span>+ S/5</span>' : ''}<button type="button" data-action="quitarFoto" data-val="${i}" aria-label="Quitar foto ${i + 1}"><i class="fa-solid fa-xmark"></i></button></div>`).join('')}</div>` : ''}
                    <p class="nota">El precio incluye hasta 3 fotos por producto. Desde la cuarta, cada foto adicional cuesta S/5${extra ? ` (llevas ${extra} adicional${extra === 1 ? '' : 'es'})` : ''}.</p>
                    ${d.fotos.length ? '<button type="button" class="btn btn-chico" data-action="listo" data-sec="fotos">Listo</button>' : ''}`;
            },
            obs(d) {
                return `<div class="campo"><textarea id="in-obs" data-borrador="obs" placeholder="Por ejemplo: que no salga el collar">${esc(d.obs)}</textarea></div>
                    <button type="button" class="btn btn-chico" data-action="listo" data-sec="obs">${d.obs.trim() ? 'Listo' : 'No, eso es todo'}</button>`;
            }
        };

        function htmlSecciones() {
            const d = S.borrador;
            let n = 0;
            return seccionesDe(d).map(k => {
                const sec = SECCIONES[k];
                const abierta = S.abierta === k;
                const lista = sec.listo(d);
                if (!sec.opcional) n++;
                const marca = lista ? '<i class="fa-solid fa-check"></i>' : (sec.opcional ? '<i class="fa-solid fa-pen"></i>' : n);
                const derecha = (!abierta && lista) ? `<span class="sec-res">${sec.resumen(d)}</span>` : (!abierta && sec.opcional ? '<span class="sec-opc">Opcional</span>' : '');
                return `<section class="sec ${abierta ? 'abierta' : ''} ${lista ? 'lista' : ''}" id="sec-${k}" data-sec="${k}">
                    <button type="button" class="sec-head" data-action="abrir" data-sec="${k}" aria-expanded="${abierta}">
                        <span class="sec-num">${marca}</span><span class="sec-tit">${sec.titulo}</span>${derecha}<i class="fa-solid fa-chevron-down"></i>
                    </button>
                    ${abierta ? `<div class="sec-body">${CUERPOS[k](d)}</div>` : ''}
                </section>`;
            }).join('');
        }
        function pintarSecciones(irA) {
            $('#secciones').innerHTML = htmlSecciones();
            pintarBarra();
            if (irA) requestAnimationFrame(() => { const el = $('#sec-' + irA); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        }
        function avanzar(desde) {
            const d = S.borrador;
            const orden = seccionesDe(d);
            const idx = orden.indexOf(desde);
            const pendientes = orden.filter(k => !SECCIONES[k].listo(d));
            S.abierta = pendientes.find(k => orden.indexOf(k) > idx) || pendientes[0] || null;
            pintarSecciones(S.abierta);
            if (!S.abierta) { const cta = $('#barra .btn'); if (cta) cta.classList.add('late'); }
        }

        // ---------- Vistas ----------
        function tituloProducto(p) {
            if (p.tipo === 'pijama') return 'Pijama ' + ((VARIANTE_UI[p.variante] || { titulo: p.variante }).titulo).toLowerCase();
            return p.variante || TIPO_LABELS[p.tipo] || p.tipo;
        }
        function chipsProducto(p) {
            const chips = [];
            if (p.talla) chips.push(`<span class="chip">Talla ${esc(p.talla)}</span>`);
            if (p.tipo_short) chips.push(`<span class="chip">Short ${p.tipo_short === 'varon' ? 'varón' : 'mujer'}</span>`);
            if (p.corte) chips.push(`<span class="chip">${p.corte === 'princesa' ? 'Princesa' : 'Clásico'}</span>`);
            if (p.color) { const c = buscarColor(p.color); chips.push(`<span class="chip">${c ? `<i style="background:${c.hex}"></i>` : ''}${esc(p.color)}</span>`); }
            if (p.patron) { const pt = p.patron === 'Sin patrón' ? null : patronDe(p.patron, p.tipo_mascota); chips.push(`<span class="chip">${pt ? `<img src="${esc(pt.imagen_url)}" alt="">` : ''}${p.patron === 'Sin patrón' ? 'Sin patrón' : 'Patrón ' + esc(p.patron)}</span>`); }
            if (p.mascota) chips.push(`<span class="chip">${esc(p.mascota)}</span>`);
            return chips.join('');
        }
        const total = () => S.productos.reduce((s, p) => s + p.precio, 0);
        const iconoCanal = c => c === 'ig' ? '<i class="fa-brands fa-instagram" style="color:#D6338C"></i>' : (c === 'wpp' ? '<i class="fa-brands fa-whatsapp" style="color:#1FAF5A"></i>' : '<i class="fa-brands fa-tiktok"></i>');

        const VISTAS = {
            datos() {
                const c = S.cliente;
                const canal = (val, icono, texto) => `<button type="button" class="op canal ${c.canal === val ? 'sel' : ''}" data-action="canal" data-val="${val}" aria-pressed="${c.canal === val}"><i class="fa-brands ${icono}"></i>${texto}<span class="tick"><i class="fa-solid fa-check"></i></span></button>`;
                return `<div class="vista">
                    <div class="hero">
                        <div class="hero-logo"><img src="/logo-icon.png" alt=""></div>
                        <h1>Arma tu pedido</h1>
                        <p>Elige tu producto, personalízalo y súbenos la foto de tu peludo 🐾</p>
                    </div>
                    <div class="bloque">
                        <h2 class="pregunta">¿Por dónde nos escribes?</h2>
                        <div class="canales">${canal('wpp', 'fa-whatsapp', 'WhatsApp')}${canal('ig', 'fa-instagram', 'Instagram')}${canal('otro', 'fa-tiktok', 'TikTok u otro')}</div>
                    </div>
                    <div class="bloque">
                        <div class="campo"><label for="in-nombre">${c.canal === 'ig' ? 'Tu usuario de Instagram' : 'Tu nombre'}</label>
                            <input type="text" id="in-nombre" data-cliente="nombre" value="${esc(c.nombre)}" placeholder="${c.canal === 'ig' ? '@tuusuario' : ''}" autocomplete="name"></div>
                        <div class="campo"><label for="in-contacto">${c.canal === 'wpp' ? 'Tu número de WhatsApp' : 'Teléfono o usuario de contacto'}</label>
                            <input type="text" id="in-contacto" data-cliente="contacto" value="${esc(c.contacto)}" inputmode="${c.canal === 'wpp' ? 'tel' : 'text'}" autocomplete="${c.canal === 'wpp' ? 'tel' : 'off'}"></div>
                    </div>
                </div>`;
            },
            tipo() {
                const tipos = ORDEN_TIPOS.filter(t => catalog.some(c => c.tipo_producto === t));
                return `<div class="vista">
                    <div class="titulo"><h1>${S.productos.length ? '¿Qué más quieres pedir?' : '¿Qué quieres pedir?'}</h1><p>Luego podrás agregar más productos al mismo pedido.</p></div>
                    <div class="productos">${tipos.map(t => {
                        const vs = catalog.filter(c => c.tipo_producto === t);
                        const min = Math.min(...vs.map(v => Number(v.precio)));
                        const desc = t === 'pijama' ? 'Con short o con pantalón' : (vs.length === 1 ? vs[0].variante : '');
                        return `<button type="button" class="op producto" data-action="tipo" data-val="${t}">
                            ${ilusTipo(t)}
                            <div class="producto-info"><b>${TIPO_LABELS[t]}</b>${desc && desc !== TIPO_LABELS[t] ? `<span>${esc(desc)}</span>` : ''}<span class="producto-precio">${vs.length > 1 ? 'Desde ' : ''}${soles(min)}</span>${t === 'pijama' ? '<span class="regalo"><i class="fa-solid fa-gift"></i> Incluye tote bag de regalo</span>' : ''}</div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>`;
                    }).join('')}</div>
                </div>`;
            },
            armar() {
                const d = S.borrador;
                return `<div class="vista">
                    <div class="armar-cab">${ilusTipo(d.tipo)}<div class="titulo"><h1>Tu ${TIPO_LABELS[d.tipo].toLowerCase()}</h1><p>Toca cada opción. Puedes volver a cualquiera para cambiarla.</p></div></div>
                    <div class="secciones" id="secciones">${htmlSecciones()}</div>
                </div>`;
            },
            pedido() {
                const c = S.cliente;
                return `<div class="vista">
                    <div class="titulo"><h1>Tu pedido</h1><p>Revisa que todo esté como lo quieres antes de enviarlo.</p></div>
                    <div class="bloque">${S.productos.map((p, i) => `
                        <article class="linea">
                            ${p.fotos[0] ? `<img class="linea-foto" src="${urlFoto(p.fotos[0])}" alt="">` : '<div class="linea-foto"></div>'}
                            <div class="linea-info">
                                <div class="linea-top"><span>${esc(tituloProducto(p))}</span><span>${soles(p.precio)}</span></div>
                                <div class="chips">${chipsProducto(p)}</div>
                                <div class="linea-acc">
                                    <button type="button" data-action="editar" data-val="${i}"><i class="fa-solid fa-pen"></i>Editar</button>
                                    <button type="button" data-action="quitar" data-val="${i}"><i class="fa-solid fa-trash"></i>Quitar</button>
                                </div>
                            </div>
                        </article>`).join('')}
                        <button type="button" class="otro" data-action="otro"><i class="fa-solid fa-plus"></i>Agregar otro producto</button>
                    </div>
                    <div class="datos-fila">${iconoCanal(c.canal)}<div><b>${esc(c.nombre)}</b><small>${esc(c.contacto)}</small></div><button type="button" class="enlace" data-action="editarDatos">Cambiar</button></div>
                    <div class="aviso">El plazo máximo de producción son 7 días hábiles 🗓️ Si tu pedido está listo antes, te escribimos para coordinar el envío ⭐</div>
                </div>`;
            },
            exito() {
                const c = S.cliente;
                const canalTexto = c.canal === 'ig' ? 'Instagram' : 'WhatsApp';
                return `<div class="vista">
                    <div class="exito">
                        <div class="exito-icono"><i class="fa-solid fa-check"></i></div>
                        <h1>¡Pedido registrado!</h1>
                        <span class="codigo">PF-DEMO-001</span>
                        ${MODO_DEMO ? '<p class="nota">Esto es una vista previa: el pedido no se envió.</p>' : ''}
                    </div>
                    <div class="pago"><i class="fa-solid fa-circle-dollar-to-slot"></i><span>Solo falta coordinar el adelanto del 50% por ${canalTexto} para empezar tu pedido 💛</span></div>
                    <div class="bloque">${S.productos.map(p => `
                        <article class="linea">
                            ${p.fotos[0] ? `<img class="linea-foto" src="${urlFoto(p.fotos[0])}" alt="">` : '<div class="linea-foto"></div>'}
                            <div class="linea-info"><div class="linea-top"><span>${esc(tituloProducto(p))}</span><span>${soles(p.precio)}</span></div><div class="chips">${chipsProducto(p)}</div></div>
                        </article>`).join('')}
                        <div class="total-fila"><span>Total</span><span>${soles(total())}</span></div>
                    </div>
                    <button type="button" class="btn btn-ancho ${c.canal === 'ig' ? '' : 'btn-wsp'}" data-action="contacto"><i class="fa-brands ${c.canal === 'ig' ? 'fa-instagram' : 'fa-whatsapp'}"></i>${c.canal === 'ig' ? 'Copiar mensaje y abrir Instagram' : 'Escribir por WhatsApp'}</button>
                    <p class="nota" style="text-align:center;">Toma una captura de esta pantalla si quieres guardar tu resumen.</p>
                    <button type="button" class="enlace" style="align-self:center;" data-action="reiniciar">Volver a empezar la vista previa</button>
                </div>`;
            }
        };

        function pintarBarra() {
            const barra = $('#barra');
            let html = '';
            if (S.vista === 'datos') html = `<button type="button" class="btn btn-ancho" data-action="continuarDatos">Continuar<i class="fa-solid fa-arrow-right"></i></button>`;
            else if (S.vista === 'tipo' && S.productos.length) html = `<div class="barra-total"><small>${S.productos.length} producto${S.productos.length === 1 ? '' : 's'} en tu pedido</small><b>${soles(total())}</b></div><button type="button" class="btn" data-action="verPedido">Ver pedido</button>`;
            else if (S.vista === 'armar') html = `<div class="barra-total"><small>${TIPO_LABELS[S.borrador.tipo]}</small><b>${S.borrador.precio ? soles(S.borrador.precio) : '—'}</b></div><button type="button" class="btn" data-action="agregar">${S.editIdx === null ? 'Agregar al pedido' : 'Guardar cambios'}</button>`;
            else if (S.vista === 'pedido') html = `<div class="barra-total"><small>Total</small><b>${soles(total())}</b></div><button type="button" class="btn" data-action="enviar">Confirmar y enviar</button>`;
            barra.innerHTML = html ? `<div class="barra-in">${html}</div>` : '';
            barra.classList.toggle('oculta', !html);
        }
        function pintar() {
            $('#app').innerHTML = VISTAS[S.vista]();
            pintarBarra();
            const paso = S.vista === 'datos' ? 0 : (S.vista === 'exito' ? 2 : 1);
            document.querySelectorAll('#pasos li').forEach((li, i) => { li.className = i < paso ? 'hecho' : (i === paso ? 'actual' : ''); });
            $('#btn-atras').hidden = S.vista === 'datos' || S.vista === 'exito';
        }
        function ir(vista) {
            S.vista = vista;
            pintar();
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        // ---------- Acciones ----------
        const ACCIONES = {
            canal(b) { S.cliente.canal = b.dataset.val; pintar(); },
            continuarDatos() {
                const c = S.cliente;
                if (!c.canal) return toast('Elige por dónde nos escribes');
                if (!c.nombre.trim()) { $('#in-nombre').focus(); return toast(c.canal === 'ig' ? 'Escribe tu usuario de Instagram' : 'Escribe tu nombre'); }
                if (!c.contacto.trim()) { $('#in-contacto').focus(); return toast('Escribe un contacto'); }
                ir(S.productos.length ? 'pedido' : 'tipo');
            },
            tipo(b) {
                S.borrador = nuevoBorrador(b.dataset.val);
                S.editIdx = null;
                S.familia = 'R';
                S.abierta = primeraPendiente(S.borrador);
                ir('armar');
            },
            abrir(b) { S.abierta = S.abierta === b.dataset.sec ? null : b.dataset.sec; pintarSecciones(S.abierta); },
            elegir(b) {
                const d = S.borrador;
                const { campo, val } = b.dataset;
                d[campo] = val;
                if (campo === 'variante') {
                    d.precio = Number((catalog.find(c => c.tipo_producto === d.tipo && c.variante === val) || {}).precio || 0);
                    if (!aplicaTipoShort(d.tipo, val)) d.tipo_short = '';
                    if (!VARIANTES_CON_CORTE.includes(val)) d.corte = '';
                }
                const sec = b.closest('.sec');
                sec.querySelectorAll('[data-action="elegir"]').forEach(x => { const s = x === b; x.classList.toggle('sel', s); x.setAttribute('aria-pressed', s); });
                pintarBarra();
                setTimeout(() => avanzar(sec.dataset.sec), 330);
            },
            familia(b) { S.familia = b.dataset.val; pintarSecciones(); },
            especie(b) { const d = S.borrador; if (d.tipo_mascota !== b.dataset.val) { d.tipo_mascota = b.dataset.val; d.patron = ''; } pintarSecciones(); },
            listo(b) {
                const d = S.borrador;
                const k = b.dataset.sec;
                if (k === 'obs') d.obsVista = true;
                if (!SECCIONES[k].listo(d)) return toast(k === 'mascota' ? 'Escribe el nombre de tu mascota' : (k === 'talla' ? 'Escribe la talla' : 'Agrega al menos una foto'));
                avanzar(k);
            },
            elegirFotos() { $('#in-fotos').click(); },
            quitarFoto(b) { S.borrador.fotos.splice(Number(b.dataset.val), 1); pintarSecciones(); },
            agregar() {
                const d = S.borrador;
                const falta = primeraObligatoriaPendiente(d);
                if (falta) {
                    S.abierta = falta;
                    pintarSecciones(falta);
                    const el = $('#sec-' + falta);
                    el.classList.add('falta');
                    setTimeout(() => el.classList.remove('falta'), 1600);
                    return toast('Te falta: ' + SECCIONES[falta].titulo.replace(/[¿?]/g, ''));
                }
                if (S.editIdx === null) S.productos.push(d); else S.productos[S.editIdx] = d;
                S.borrador = null;
                S.editIdx = null;
                ir('pedido');
                toast('Producto agregado a tu pedido');
            },
            otro() { ir('tipo'); },
            verPedido() { ir('pedido'); },
            editar(b) {
                S.editIdx = Number(b.dataset.val);
                const p = S.productos[S.editIdx];
                S.borrador = { ...p, fotos: [...p.fotos] };
                S.abierta = null;
                ir('armar');
            },
            quitar(b) {
                const i = Number(b.dataset.val);
                confirmar('¿Quitar este producto?', 'Se perderán las fotos y opciones que elegiste para él.', 'Quitar', () => {
                    S.productos.splice(i, 1);
                    ir(S.productos.length ? 'pedido' : 'tipo');
                });
            },
            editarDatos() { ir('datos'); },
            enviar() {
                if (!S.productos.length) return toast('Agrega al menos un producto');
                ir('exito');
                lanzarConfeti();
            },
            contacto() { toast('En la versión final se abre el chat con tu código de pedido'); },
            reiniciar() { S.cliente = { canal: '', nombre: '', contacto: '' }; S.productos = []; ir('datos'); },
            atras() {
                if (S.vista === 'armar') {
                    const volver = () => { S.borrador = null; S.editIdx = null; ir(S.productos.length ? 'pedido' : 'tipo'); };
                    const d = S.borrador;
                    const tocado = S.editIdx !== null || d.talla || d.color || d.patron || d.fotos.length || d.mascota || (SECCIONES.modelo.aplica(d) && d.variante);
                    if (tocado) confirmar('¿Salir sin guardar?', 'Se perderá lo que elegiste para este producto.', 'Salir', volver); else volver();
                } else if (S.vista === 'tipo') ir(S.productos.length ? 'pedido' : 'datos');
                else if (S.vista === 'pedido') ir('datos');
            },
            cerrarHoja(b, e) { if (e.target === b || b.classList.contains('btn')) $('#hoja').innerHTML = ''; },
            okHoja() { $('#hoja').innerHTML = ''; if (confirmar.onOk) confirmar.onOk(); }
        };

        document.addEventListener('click', e => {
            const b = e.target.closest('[data-action]');
            if (b && ACCIONES[b.dataset.action]) ACCIONES[b.dataset.action](b, e);
        });
        document.addEventListener('input', e => {
            const t = e.target;
            if (t.dataset.cliente) S.cliente[t.dataset.cliente] = t.value;
            else if (t.dataset.borrador && S.borrador) S.borrador[t.dataset.borrador] = t.value;
        });
        document.addEventListener('change', e => {
            if (e.target.id !== 'in-fotos' || !S.borrador) return;
            for (const f of e.target.files) if (f.type.startsWith('image/')) S.borrador.fotos.push(f);
            pintarSecciones();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && e.target.matches('input') && S.vista === 'datos') ACCIONES.continuarDatos();
        });

        // ---------- Confeti con los colores de la marca ----------
        function lanzarConfeti() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const cv = $('#confeti');
            const ctx = cv.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
            ctx.scale(dpr, dpr);
            const colores = ['#E8703A', '#C4522A', '#D9A05B', '#2F7D5B', '#FCE6D8', '#FF934F'];
            const piezas = Array.from({ length: 110 }, () => ({
                x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .28,
                vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4,
                t: Math.random() * 7 + 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, c: colores[Math.random() * colores.length | 0], redondo: Math.random() < .3
            }));
            const inicio = performance.now();
            (function cuadro(ahora) {
                const vida = (ahora - inicio) / 2600;
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                if (vida >= 1) return;
                ctx.globalAlpha = Math.min(1, (1 - vida) * 2.2);
                for (const p of piezas) {
                    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
                    if (p.redondo) { ctx.beginPath(); ctx.arc(0, 0, p.t / 2, 0, 6.28); ctx.fill(); } else ctx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2);
                    ctx.restore();
                }
                requestAnimationFrame(cuadro);
            })(inicio);
        }

        // ---------- Arranque ----------
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const [cat, pat] = await Promise.all([
                    sb.from('catalogo_productos').select('*').eq('activo', true),
                    sb.from('patrones').select('*').eq('activo', true)
                ]);
                if (cat.error) throw cat.error;
                if (pat.error) throw pat.error;
                catalog = cat.data.filter(c => c.tipo_producto !== 'manta');
                patterns = pat.data.sort((a, b) => Number(a.nombre) - Number(b.nombre));
                pintar();
            } catch (err) {
                console.error(err);
                $('#app').innerHTML = '<p class="cargando">No se pudo cargar el formulario. Intenta de nuevo en unos minutos.</p>';
            }
        });
    </script>
